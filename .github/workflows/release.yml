name: release

# Tag `v*` → three lanes (local kit in ~/creds/apple + ~/creds/android, see
# ~/creds/README.md):
#   macos   — universal dmg, Developer ID signed + notarized, → GitHub Release
#   ios     — App Store ipa (Apple Distribution + "EchoWall App Store"
#             profile, both minted via the ASC API), uploaded to TestFlight
#             only with an explicitly requested dispatch upload; tags publish
#             macOS/Android assets without resubmitting an existing iOS build
#   android — signed universal-release APK (upload keystore) → GitHub Release
#   windows — unsigned CI proof for MSI + NSIS until an Authenticode signing
#             identity is explicitly provisioned; never attached to a release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload the verified iOS build to TestFlight (default is build only)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows installers (unsigned CI proof)
        working-directory: desktop
        run: npm run tauri build -- --ci --bundles nsis,msi

      - name: Upload Windows installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EchoWall-windows-unsigned
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Verify embedded processing and local inference boundaries
        working-directory: desktop
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          for manifest in \
            src-tauri \
            local-whisper-protocol \
            local-summary-protocol \
            local-qwen-protocol \
            local-moss-protocol \
            local-audio \
            whisper-worker \
            qwen-worker \
            summary-worker \
            moss-worker \
            local-quality-eval; do
            cargo audit --file "$manifest/Cargo.lock"
          done
          cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --locked --all-targets --manifest-path local-whisper-protocol/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path local-whisper-protocol/Cargo.toml -- -D warnings
          cargo test --locked --all-targets --manifest-path local-summary-protocol/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path local-summary-protocol/Cargo.toml -- -D warnings
          cargo test --locked --all-targets --manifest-path local-qwen-protocol/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path local-qwen-protocol/Cargo.toml -- -D warnings
          node scripts/verify_local_sidecar_contract.mjs
          node --test scripts/macos_sidecars.test.mjs
          python3 -m unittest discover -s scripts -p 'test_build_ios_release.py'
          cargo test --locked --all-targets --manifest-path local-moss-protocol/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path local-moss-protocol/Cargo.toml -- -D warnings
          cargo test --locked --all-targets --manifest-path local-audio/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path local-audio/Cargo.toml -- -D warnings
          cargo test --locked --all-targets --manifest-path whisper-worker/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path whisper-worker/Cargo.toml -- -D warnings
          cargo test --locked --all-targets --manifest-path qwen-worker/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path qwen-worker/Cargo.toml -- -D warnings
          cargo test --locked --all-targets --manifest-path summary-worker/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path summary-worker/Cargo.toml -- -D warnings
          cargo test --locked --all-targets --manifest-path moss-worker/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path moss-worker/Cargo.toml -- -D warnings
          cargo test --locked --all-targets --manifest-path local-quality-eval/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path local-quality-eval/Cargo.toml -- -D warnings
          swift test --package-path diarization-worker --configuration release

      - name: Write notary API key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build universal bundle (signed + notarized)
        working-directory: desktop
        env:
          ECHOWALL_MOSS_CANDIDATE_ENABLED: "1"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: npm run tauri:build:macos -- --target universal-apple-darwin

      - name: Locate artifact
        id: artifact
        run: |
          shopt -s nullglob
          DMGS=(desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#DMGS[@]}" -eq 1
          DMG="${DMGS[0]}"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$DMG")" >> "$GITHUB_OUTPUT"

      - name: Verify signed macOS bundle privacy
        working-directory: desktop
        run: |
          ./scripts/verify_macos_bundle_privacy.sh \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/EchoWall.app

      - name: Notarize and verify disk image
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          desktop/scripts/notarize_macos_dmg.sh \
            "${{ steps.artifact.outputs.path }}"

      - name: Upload verified macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoWall-macos-release
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Import distribution cert + provisioning profile
        env:
          APPLE_DIST_CERTIFICATE: ${{ secrets.APPLE_DIST_CERTIFICATE }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_SHARE_PROVISIONING_PROFILE: ${{ secrets.APPLE_SHARE_PROVISIONING_PROFILE }}
        run: |
          test -n "$APPLE_SHARE_PROVISIONING_PROFILE" || {
            echo "::error::EchoWall Share Extension profile has not been explicitly provisioned"
            exit 1
          }
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          printf '%s' "$APPLE_DIST_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$APPLE_DIST_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KEYCHAIN"
          PROFILES="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILES" "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/echowall.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/echowall.mobileprovision" > "$RUNNER_TEMP/echowall-profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$RUNNER_TEMP/echowall-profile.plist" \
            | grep -q 'group.ai.ax.watch-transcriber' || {
              echo "::error::EchoWall App Store profile is missing the shared App Group entitlement"
              exit 1
            }
          UUID=$(security cms -D -i "$RUNNER_TEMP/echowall.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/echowall.mobileprovision" "$PROFILES/$UUID.mobileprovision"
          cp "$RUNNER_TEMP/echowall.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          printf '%s' "$APPLE_SHARE_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/echowall-share.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/echowall-share.mobileprovision" > "$RUNNER_TEMP/echowall-share-profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$RUNNER_TEMP/echowall-share-profile.plist" \
            | grep -q 'group.ai.ax.watch-transcriber' || {
              echo "::error::EchoWall Share App Store profile is missing the shared App Group entitlement"
              exit 1
            }
          SHARE_UUID=$(security cms -D -i "$RUNNER_TEMP/echowall-share.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/echowall-share.mobileprovision" "$PROFILES/$SHARE_UUID.mobileprovision"
          cp "$RUNNER_TEMP/echowall-share.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$SHARE_UUID.mobileprovision"

      - name: Build and verify fresh App Store IPA
        id: ipa
        working-directory: desktop
        run: python3 scripts/build_ios_release.py

      - name: Upload ipa as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoWall-ipa
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Verify Android native unit, lint, and instrumentation artifact
        working-directory: desktop
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          npm run tauri android build -- --debug --target aarch64 --apk
          cd src-tauri/gen/android
          ./gradlew \
            :app:testArm64DebugUnitTest \
            :app:lintArm64Debug \
            :app:assembleArm64DebugAndroidTest \
            -x :app:rustBuildArm64Debug

      - name: Write keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed universal APK
        working-directory: desktop
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: echowall
        run: npm run tauri android build -- --target aarch64 x86_64 --apk --ci

      - name: Locate + rename APK
        id: apk
        run: |
          mapfile -t APKS < <(find desktop/src-tauri/gen/android/app/build/outputs/apk -name '*universal-release*.apk')
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          VER=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          OUT="EchoWall_${VER}_universal.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload signed Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoWall-android-release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

  publish:
    needs: [windows, macos, ios, android]
    if: github.event_name == 'push' || inputs.upload_testflight
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Validate release tag before publishing
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(plutil -extract version raw desktop/src-tauri/tauri.conf.json)
          test "$GITHUB_REF_NAME" = "v$VERSION"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to replace its artifacts"
            exit 1
          fi

      - name: Download verified iOS artifact
        if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
        uses: actions/download-artifact@v4
        with:
          name: EchoWall-ipa
          path: artifacts/ios

      - name: Upload verified IPA to TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          shopt -s nullglob
          IPAS=(artifacts/ios/*.ipa)
          test "${#IPAS[@]}" -eq 1
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          trap 'rm -f "$KEY_PATH"' EXIT
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$KEY_PATH"
          xcrun altool --upload-app -f "${IPAS[0]}" -t ios \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"

      - name: Download public release artifacts
        if: github.event_name == 'push'
        uses: actions/download-artifact@v4
        with:
          pattern: EchoWall-*-release
          path: artifacts/public
          merge-multiple: true

      - name: Publish versioned release once
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(plutil -extract version raw desktop/src-tauri/tauri.conf.json)
          test "$GITHUB_REF_NAME" = "v$VERSION"
          shopt -s nullglob
          DMGS=(artifacts/public/*.dmg)
          APKS=(artifacts/public/*.apk)
          test "${#DMGS[@]}" -eq 1
          test "${#APKS[@]}" -eq 1
          # Never replace an existing release or asset. A rerun stops here
          # for an explicit decision instead of hiding a publication failure.
          gh release create "$GITHUB_REF_NAME" "${DMGS[0]}" "${APKS[0]}" \
            --verify-tag --title "回音壁 EchoWall $GITHUB_REF_NAME" --generate-notes
