[package]
name = "echowall-moss-worker"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
echowall-local-moss-protocol = { path = "../local-moss-protocol" }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
hex = "0.4"
libc = "0.2"
sha2 = "0.11"
echowall-local-audio = { path = "../local-audio" }
tempfile = "3"
transcribe-cpp = { git = "https://github.com/handy-computer/transcribe.cpp", rev = "63a44d9239d610b3908e8a66b384924cd4a77217", default-features = false, features = ["metal"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
hound = "=3.5.1"

[profile.release]
strip = "symbols"
