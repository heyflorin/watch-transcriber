[package]
name = "echowall-qwen-worker"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.88"

[dependencies]
echowall-local-qwen-protocol = { path = "../local-qwen-protocol" }
hex = "0.4"
serde_json = "1"
sha2 = "0.11"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
qwen-asr = { version = "=0.11.0" }
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "isomp4", "mp3", "pcm", "wav"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = "symbols"
