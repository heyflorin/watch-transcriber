[package]
name = "echowall-summary-worker"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.88"

[dependencies]
echowall-local-summary-protocol = { path = "../local-summary-protocol" }
hex = "0.4"
serde_json = "1"
sha2 = "0.11"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
libc = "0.2"
llama-cpp-2 = { version = "=0.1.156", default-features = false, features = ["metal"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = "symbols"
