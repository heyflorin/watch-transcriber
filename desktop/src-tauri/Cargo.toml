[package]
name = "desktop"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[features]
# Same UI/processing code with isolated paths and Keychain service names.
# Explicit build-only QA flavor; never a runtime switch or release default.
isolated-qa = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-echowall-capture = { path = "../plugins/echowall-capture" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.7.0", features = ["fs"] }
flate2 = "1.1.9"
tar = "0.4.46"
hmac = "0.13.0"
sha2 = "0.11.0"
sha1 = "0.10.6"
hex = "0.4.3"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
zeroize = { version = "1", features = ["derive"] }
futures-util = "0.3.33"
keyring-core = "1.0.0"
tower = { version = "0.5.3", features = ["util"] }
percent-encoding = "2.3.2"
filetime = "0.2.29"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream"] }
rustls = { version = "0.23.42", default-features = false, features = ["aws-lc-rs"] }
webpki-roots = "1.0.9"
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "isomp4", "mp3", "pcm", "wav"] }
async-trait = "0.1.91"
crc64fast = "1.1.0"
tokio-util = { version = "0.7.18", features = ["io"] }
fs2 = "0.4.3"
echowall-local-whisper-protocol = { path = "../local-whisper-protocol" }
echowall-local-moss-protocol = { path = "../local-moss-protocol" }
echowall-local-audio = { path = "../local-audio" }
echowall-local-summary-protocol = { path = "../local-summary-protocol" }
echowall-local-qwen-protocol = { path = "../local-qwen-protocol" }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = "symbols"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
jni = "0.22.4"
ndk-context = "0.1.1"

[target.'cfg(target_vendor = "apple")'.dependencies]
apple-native-keyring-store = { version = "1.0.1", features = ["keychain", "protected"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22.1"
block2 = "0.6.2"
cpal = "0.18.2"
image = { version = "0.25", default-features = false, features = ["png"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSBitmapImageRep", "NSImage", "NSImageRep", "NSRunningApplication", "libc"] }
objc2-av-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSDictionary", "NSObject", "NSProcessInfo"] }
screencapturekit = { version = "9.0.1", features = ["macos_13_0"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }
windows-core = "0.61.2"
windows = { version = "0.61.3", features = [
  "Wdk_System_SystemServices",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_Storage_StructuredStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Performance",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
