[package]
name = "tauri-plugin-echowall-capture"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-echowall-capture"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", features = ["wry"] }
