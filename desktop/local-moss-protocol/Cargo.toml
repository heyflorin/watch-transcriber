[package]
name = "echowall-local-moss-protocol"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
sha2 = "0.11"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
