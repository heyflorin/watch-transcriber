[package]
name = "echowall-whisper-worker"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.88"

[dependencies]
echowall-local-whisper-protocol = { path = "../local-whisper-protocol" }
hex = "0.4"
serde_json = "1"
sha2 = "0.11"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "isomp4", "mp3", "pcm", "wav"] }
whisper-rs = { version = "=0.16.0", features = ["metal"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = "symbols"
